<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1e1e1e;
      font-family: Arial;
    }
    .calculadora {
      background: #2c2c2c;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    #pantalla {
      width: 100%;
      height: 50px;
      font-size: 20px;
      margin-bottom: 10px;
      text-align: right;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }
    .botones {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      gap: 10px;
    }
    button {
      height: 60px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .operador { background: orange; }
    .igual { background: green; color: white; }
    .limpiar { background: red; color: white; }
  </style>
</head>
<body><div class="calculadora">
  <input type="text" id="pantalla" disabled>  <div class="botones">
    <button onclick="agregar('7')">7</button>
    <button onclick="agregar('8')">8</button>
    <button onclick="agregar('9')">9</button>
    <button class="operador" onclick="agregar('/')">÷</button><button onclick="agregar('4')">4</button>
<button onclick="agregar('5')">5</button>
<button onclick="agregar('6')">6</button>
<button class="operador" onclick="agregar('*')">×</button>

<button onclick="agregar('1')">1</button>
<button onclick="agregar('2')">2</button>
<button onclick="agregar('3')">3</button>
<button class="operador" onclick="agregar('-')">−</button>

<button onclick="agregar('0')">0</button>
<button onclick="agregar('.')">.</button>
<button class="igual" onclick="calcular()">=</button>
<button class="operador" onclick="agregar('+')">+</button>

<button class="limpiar" onclick="limpiar()" style="grid-column: span 4;">C</button>

  </div>
</div><script>
  function agregar(valor) {
    document.getElementById('pantalla').value += valor;
  }

  function calcular() {
    try {
      document.getElementById('pantalla').value = eval(document.getElementById('pantalla').value);
    } catch {
      document.getElementById('pantalla').value = 'Error';
    }
  }

  function limpiar() {
    document.getElementById('pantalla').value = '';
  }
</script></body>
  </html>
